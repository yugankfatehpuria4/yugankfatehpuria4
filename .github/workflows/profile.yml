name: profile

# Two jobs that keep the README's generated pieces current:
#   header  — redraws assets/header.svg from live GitHub data, commits on change
#   snake   — renders the contribution graph animation onto the `output` branch
#
# The snake art lives on its own orphan branch rather than main so the
# animation can be regenerated daily without adding a commit to main every
# time, and so a binary-ish SVG never clutters the source history.

on:
  schedule:
    - cron: '17 3 * * *'   # daily, off the hour to dodge Actions rush
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild header card
        env:
          # raises the API rate limit; no extra scope needed for public data
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-header.mjs

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/header.svg; then
            echo "header.svg unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg
          git commit -m "chore: refresh profile header"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
